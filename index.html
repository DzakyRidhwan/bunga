<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bunga untuk Aqilah Alfi Sahlaa</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#1a0b2e;--bg2:#3b1450;--bg3:#7a2a63;--ink:#fff5fa;--soft:#ffd3e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);font-family:'Quicksand',system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.txt{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 7vh);text-align:center;pointer-events:none;padding:0 16px}
.for{font-size:clamp(12px,2.4vw,16px);letter-spacing:.35em;text-transform:uppercase;color:var(--soft);opacity:0;animation:fade 2s .3s forwards}
.name{font-family:'Great Vibes','Brush Script MT',cursive;font-size:clamp(44px,11vw,104px);line-height:1.1;margin:.1em 0;background:linear-gradient(90deg,#ffd1e8,#fff,#ffc2e0,#fff,#ffd1e8);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,150,210,.6));opacity:0;animation:fade 2.4s .9s forwards,shine 6s linear infinite}
.sub{font-size:clamp(13px,2.8vw,18px);color:var(--soft);opacity:0;animation:fade 2s 2.2s forwards}
.hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:0;right:0;text-align:center;font-size:13px;color:var(--soft);opacity:.7;pointer-events:none}
@keyframes fade{to{opacity:1}}
@keyframes shine{to{background-position:250% 0}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="txt">
  <div class="for">Untuk yang istimewa</div>
  <div class="name">Aqilah Alfi Sahlaa</div>
  <div class="sub">Semoga harimu seindah dan sewangi bunga-bunga ini 🌸</div>
</div>
<div class="hint">Sentuh layar untuk menanam bunga ✨</div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
let W,H;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();
const R=Math.random,TAU=Math.PI*2,ease=t=>1-Math.pow(1-t,3);
const hues=[330,340,350,300,285,15,45,320];
const stars=Array.from({length:90},()=>({x:R(),y:R()*.7,r:R()*1.4+.3,p:R()*TAU}));
const flowers=[],petals=[],sparks=[];

function Flower(px,top){
  this.x=px;this.top=top;this.t=0;this.hue=hues[(R()*hues.length)|0];
  this.n=8+((R()*6)|0);this.r=26+R()*30;this.rot=R()*TAU;
  this.bend=(R()-.5)*90;this.ph=R()*TAU;this.spd=.004+R()*.003;
}
Flower.prototype.pt=function(s,sw){
  const x0=this.x,y0=H,cx=this.x+this.bend,cy=(H+this.top)/2,x1=this.x+sw,y1=this.top;
  const u=1-s;return [u*u*x0+2*u*s*cx+s*s*x1,u*u*y0+2*u*s*cy+s*s*y1];
};
Flower.prototype.draw=function(time){
  if(this.t<1)this.t=Math.min(1,this.t+this.spd);
  const sw=Math.sin(time/1400+this.ph)*8;
  const s=ease(Math.min(1,this.t/.65));
  // stem
  g.strokeStyle='#4fae6a';g.lineWidth=3;g.lineCap='round';g.beginPath();
  for(let i=0;i<=24;i++){const p=this.pt(s*i/24,sw*(s*i/24));i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}
  g.stroke();
  // leaves
  if(s>.45){
    const k=Math.min(1,(s-.45)*3),p=this.pt(.45,sw*.45);
    g.fillStyle='#5cc27a';
    [[-1,.35],[1,.6]].forEach(([d,q])=>{const pp=this.pt(q*s,sw*q);g.save();g.translate(pp[0],pp[1]);g.rotate(d*.7);g.beginPath();g.ellipse(d*12*k,0,14*k,5*k,0,0,TAU);g.fill();g.restore()});
  }
  const b=ease(Math.max(0,(this.t-.6)/.4));
  if(b<=0)return;
  const h=this.pt(s,sw);g.save();g.translate(h[0],h[1]);g.rotate(Math.sin(time/2000+this.ph)*.08);
  // glow
  const gl=g.createRadialGradient(0,0,0,0,0,this.r*2*b);
  gl.addColorStop(0,`hsla(${this.hue},100%,75%,.35)`);gl.addColorStop(1,`hsla(${this.hue},100%,75%,0)`);
  g.fillStyle=gl;g.beginPath();g.arc(0,0,this.r*2*b,0,TAU);g.fill();
  // petals (2 layers)
  for(let l=0;l<2;l++){
    const sc=l?.62:1,off=l?Math.PI/this.n:0;
    g.fillStyle=`hsl(${this.hue},${l?90:78}%,${l?80:66}%)`;
    g.strokeStyle=`hsla(${this.hue},90%,92%,.55)`;g.lineWidth=1;
    for(let i=0;i<this.n;i++){
      g.save();g.rotate(this.rot+off+i*TAU/this.n+b*.6);
      g.beginPath();g.ellipse(this.r*.52*sc*b,0,this.r*.5*sc*b,this.r*.23*sc*b,0,0,TAU);g.fill();g.stroke();g.restore();
    }
  }
  // center
  const cg=g.createRadialGradient(0,0,0,0,0,this.r*.28*b+.1);
  cg.addColorStop(0,'#fff6b0');cg.addColorStop(1,'#ffb627');
  g.fillStyle=cg;g.beginPath();g.arc(0,0,this.r*.26*b,0,TAU);g.fill();
  g.restore();
  if(this.t>=1&&!this.done){this.done=1;for(let i=0;i<6;i++)petals.push(newPetal(h[0],h[1],this.hue))}
};

function newPetal(x,y,hue){return{x,y,hue,s:5+R()*6,a:R()*TAU,va:(R()-.5)*.06,vy:.4+R()*.7,ph:R()*TAU,life:1}}
function spark(x,y){for(let i=0;i<14;i++){const a=R()*TAU,v=1+R()*3;sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1})}}

function plant(px,py){
  flowers.push(new Flower(px,Math.max(H*.34,Math.min(py,H*.85))));
  if(flowers.length>34)flowers.shift();
  spark(px,py);
}
addEventListener('pointerdown',e=>plant(e.clientX,e.clientY));

for(let i=0;i<8;i++)setTimeout(()=>plant(W*(.08+.84*R()),H*(.4+.4*R())),400+i*450);
setInterval(()=>plant(W*(.05+.9*R()),H*(.4+.45*R())),1500);
setInterval(()=>{if(R()<.9)petals.push(newPetal(R()*W,-10,hues[(R()*hues.length)|0]))},350);

function frame(time){
  g.clearRect(0,0,W,H);
  stars.forEach(s=>{g.fillStyle=`rgba(255,240,250,${.35+.35*Math.sin(time/700+s.p)})`;g.beginPath();g.arc(s.x*W,s.y*H,s.r,0,TAU);g.fill()});
  // moon glow
  const mg=g.createRadialGradient(W*.85,H*.15,0,W*.85,H*.15,H*.25);
  mg.addColorStop(0,'rgba(255,220,240,.35)');mg.addColorStop(1,'rgba(255,220,240,0)');
  g.fillStyle=mg;g.fillRect(0,0,W,H);
  flowers.forEach(f=>f.draw(time));
  for(let i=petals.length-1;i>=0;i--){
    const p=petals[i];p.y+=p.vy;p.x+=Math.sin(time/700+p.ph)*.8;p.a+=p.va;
    g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=`hsla(${p.hue},85%,80%,.85)`;
    g.beginPath();g.ellipse(0,0,p.s,p.s*.5,0,0,TAU);g.fill();g.restore();
    if(p.y>H+20)petals.splice(i,1);
  }
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.05;s.l-=.02;
    if(s.l<=0){sparks.splice(i,1);continue}
    g.fillStyle=`rgba(255,235,170,${s.l})`;g.beginPath();g.arc(s.x,s.y,2.2*s.l,0,TAU);g.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
